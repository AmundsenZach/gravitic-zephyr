<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Gravitic Zephyr</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <canvas id="gameCanvas"></canvas>

        <div class="userInterface">
            <div id="userStats">
                Flight:<br>
            </div>
            <div id="gameDebug">
                Frame Rate: <span id="frameRate">0.00</span><br>
                Frame Time: <span id="frameTime">0.00</span><br>
                Average Frame Rate: <span id="averageFrameRate">0.00</span><br>
                Average Frame Time: <span id="averageFrameTime">0.00</span><br>
            </div>
            <div id="userControls">
                Controls:<br>
            </div>
            <div id="github">
                <a id="githubLink" href="https://github.com/AmundsenZach/gravitic-zephyr/" target="blank">VISIT THE GITHUB PROJECT PAGE</a>
            </div>
        </div>

        <div id="scripts">
            <!-- assets -->
            <script src="js/game/assets/celestialAsset.js"></script>
            <script src="js/game/assets/spacecraftAsset.js"></script>

            <!-- engine -->
            <script src="js/engine/core/engineAssets.js"></script>
            <script src="js/engine/core/engineConfig.js"></script>
            <script src="js/engine/core/engineEvent.js"></script>
            <script src="js/engine/core/engineLoop.js"></script>
            <script src="js/engine/core/engineStart.js"></script>
            <!-- game -->
            <script src="js/game/core/gameConfig.js"></script>
            <script src="js/game/core/gameStart.js"></script>

            <!-- input -->
            <script src="js/engine/input/keyboardInput.js"></script>
            <script src="js/engine/input/mouseInput.js"></script>

            <!-- rendering -->
            <script src="js/game/rendering/sprites/celestialSprite.js"></script>
            <script src="js/game/rendering/sprites/spacecraftSprite.js"></script>

            <script src="js/game/rendering/systems/background.js"></script>
            <script src="js/game/rendering/systems/camera.js"></script>
            <script src="js/game/rendering/systems/interface.js"></script>

            <script src="js/engine/rendering/rendering.js"></script>

            <!-- managers -->
            <script src="js/game/managers/assetManager.js"></script>
            <script src="js/game/managers/simulationManager.js"></script>
            <script src="js/game/managers/spriteManager.js"></script>

            <!-- tests -->
            <script src="js/tests/testStart.js"></script>

            <!-- utilites -->
            <script src="js/engine/utilities/mathUtilities.js"></script>
            <script src="js/engine/utilities/physicsUtilities.js"></script>
            <script src="js/engine/utilities/vectorUtilities.js"></script>

            <!-- main -->
            <script src="js/main.js"></script>
        </div>
    </body>
</html>
